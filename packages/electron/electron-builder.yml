appId: com.crossborder.pro
productName: AI CrossBorder Pro
copyright: Copyright 2026 Clearzero2

directories:
  output: release11
  buildResources: resources

# Only include Electron main process in ASAR
# Backend/Frontend go via extraResources (outside ASAR)
files:
  - dist-electron/**/*
  - package.json
  - "!node_modules/@ai-crossborder/**/*"

npmRebuild: false

mac:
  target:
    - dmg
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: false

dmg:
  title: AI CrossBorder Pro
  artifactName: AI-CrossBorder-Pro-${version}-mac-${arch}.${ext}

win:
  target:
    - nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: AI-CrossBorder-Pro-${version}-win-${arch}-setup.${ext}
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
  artifactName: AI-CrossBorder-Pro-${version}-linux-${arch}.${ext}

publish:
  provider: github
  owner: Clearzero22
  repo: ai-crossborder-pro
  releaseType: release

extraResources:
  - from: backend-dist
    to: backend-dist
  - from: frontend-dist
    to: frontend-dist
  - from: backend_dist_node_modules
    to: backend_node_modules
  - from: node-runtime/node.exe
    to: node-runtime/node.exe
